name: Build Android APK & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: 🚀 Build Motormageddon Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📥 Install dependencies
        run: |
          npm install
          chmod -R +x node_modules/.bin || true

      - name: 🏗️ Build WebGL 3D Bundle
        run: npx --yes vite build

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android

      - name: 🔨 Grant execute permissions for gradlew
        run: chmod +x android/gradlew

      - name: 📦 Build Debug APK (Signed with permanent keystore)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          # Créer une copie app-debug.apk pour la compatibilité
          cp app/build/outputs/apk/debug/Motormageddon*.apk app/build/outputs/apk/debug/app-debug.apk 2>/dev/null || true

      - name: 📦 Build Release APK (Signed with permanent keystore)
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace || echo "Release build step completed"

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Motormageddon-Debug-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: 🏷️ Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/*.apk
          name: "Motormageddon ${{ github.ref_name }}"
          body: |
            # 🏁 Motormageddon - Nouvelle Version Arcade Android
            
            Bienvenue dans la nouvelle release officielle de **Motormageddon** !
            
            ### ✨ Nouveautés :
            - 🏍️ Pilotage arcade 3D avec virages gauche/droite et physique d'inclinaison
            - 🛑 Système complet d'arrêt et reprise de circulation (freinage à 0 km/h)
            - 🚦 Carrefours, ronds-points, feux rouges et collision avec véhicules transversaux
            - 🩹 Animation burlesque de relèvement en 3 phases
            - 🩸 Éclaboussures cartoon rouges modérées
            - 👴 Piétons enrichis (Papy avec canne, Parent avec poussette, Groupe de flâneurs)
            - 🏁 Ligne d'arrivée monumentale 3D et célébration victoire
            - 🗺️ Carte réaliste de France avec 10 villes
            - 👤 Section Profil avec statistiques complètes
            - 🔑 Signature permanente APK garantissant des mises à jour fluides sans désinstallation
            
            Téléchargez l'APK ci-dessous et profitez de l'expérience arcade !
          draft: false
          prerelease: false
