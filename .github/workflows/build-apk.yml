name: Build Android APK & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: 🚀 Build Motormageddon Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📥 Install dependencies
        run: |
          npm install
          chmod -R +x node_modules/.bin || true

      - name: 🏗️ Build WebGL 3D Bundle
        run: npx --yes vite build

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android

      - name: 🔨 Grant execute permissions for gradlew
        run: chmod +x android/gradlew

      - name: 📦 Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📦 Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace || echo "Release build step completed"

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Motormageddon-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: 🏷️ Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
          name: "Motormageddon ${{ github.ref_name }}"
          body: |
            # 🏁 Motormageddon - Nouvelle Version Arcade Android
            
            Bienvenue dans la nouvelle release officielle de **Motormageddon** !
            
            ### ✨ Nouveautés :
            - 🏍️ Pilotage arcade 3D avec physique d'inclinaison et rebonds
            - 🇫🇷 Nouvelles étapes françaises (Paris, Lyon, Marseille, Nice, Bordeaux, Strasbourg)
            - 🤸 Bibliothèque de personnages burlesques et collisions cartoon
            - 🛠️ Garage complet avec 4 motos et personnalisation
            - 💾 Système de sauvegarde persistante
            
            Téléchargez le fichier `app-debug.apk` ci-dessous et installez-le sur votre smartphone Android.
          draft: false
          prerelease: false
