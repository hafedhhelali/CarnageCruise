name: Build Android APK & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: carnagecruise-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    name: 🚀 Build Carnage Cruise Godot Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🏷️ Extract App Version & Beta Channel
        id: version_info
        run: |
          APP_VER=$(node -p "require('./version.json').version")
          VER_CODE=$(node -p "require('./version.json').versionCode")
          CHANNEL=$(node -p "require('./version.json').channel || 'beta'")
          RELEASE_TITLE=$(node -p "require('./version.json').releaseName || 'Carnage Cruise Godot'")
          echo "APP_VERSION=$APP_VER" >> $GITHUB_ENV
          echo "VERSION_CODE=$VER_CODE" >> $GITHUB_ENV
          echo "CHANNEL=$CHANNEL" >> $GITHUB_ENV
          echo "RELEASE_TITLE=$RELEASE_TITLE" >> $GITHUB_ENV
          echo "==============================================="
          echo "📦 Carnage Cruise Version: v$APP_VER (Build $VER_CODE)"
          echo "🏷️ Canal: $CHANNEL"
          echo "==============================================="

      - name: 🎮 Install Godot 4.7.2-stable & Android Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable ~/.config/godot
          curl -fsSL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot_bin
          chmod +x /tmp/godot_bin/Godot_v4.7.2-stable_linux.x86_64
          sudo mv /tmp/godot_bin/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          curl -fsSL -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
          cat <<EOF > ~/.config/godot/editor_settings-4.7.tres
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

      - name: 🔄 Import Godot Project Assets
        run: godot --headless --path godot --import

      - name: 📦 Export Signed Godot Release APK
        run: |
          mkdir -p android/out
          godot --headless --path godot --export-release "Android" "$GITHUB_WORKSPACE/android/out/CarnageCruise-Godot-v${{ env.APP_VERSION }}-b${{ env.VERSION_CODE }}-release.apk"
          ls -lh android/out/

      - name: 📤 Upload Versioned Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarnageCruise-Godot-v${{ env.APP_VERSION }}-b${{ env.VERSION_CODE }}-Release-APK
          path: |
            android/out/CarnageCruise-Godot-*-release.apk
          retention-days: 14

      - name: 🏷️ Publish GitHub Beta Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          files: |
            android/out/CarnageCruise-Godot-*-release.apk
          name: "Carnage Cruise Godot v${{ env.APP_VERSION }} [BETA]"
          body: |
            # 🏁 Carnage Cruise v${{ env.APP_VERSION }} (Godot 4.7.2 Natif)

            **Version :** `v${{ env.APP_VERSION }}` (Build `${{ env.VERSION_CODE }}`)  
            **Moteur :** Godot 4.7.2-stable (Vulkan / Mobile Renderer)  
            **Édition :** `${{ env.RELEASE_TITLE }}`
          draft: false
          prerelease: true
