name: Build Android APK & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: 🚀 Build Motormageddon Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🏷️ Extract App Version & Beta Channel
        id: version_info
        run: |
          APP_VER=$(node -p "require('./version.json').version")
          VER_CODE=$(node -p "require('./version.json').versionCode")
          CHANNEL=$(node -p "require('./version.json').channel || 'beta'")
          RELEASE_TITLE=$(node -p "require('./version.json').releaseName || 'Tour de France Arcade'")
          echo "APP_VERSION=$APP_VER" >> $GITHUB_ENV
          echo "VERSION_CODE=$VER_CODE" >> $GITHUB_ENV
          echo "CHANNEL=$CHANNEL" >> $GITHUB_ENV
          echo "RELEASE_TITLE=$RELEASE_TITLE" >> $GITHUB_ENV
          echo "app_version=$APP_VER" >> $GITHUB_OUTPUT
          echo "version_code=$VER_CODE" >> $GITHUB_OUTPUT
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT
          echo "==============================================="
          echo "📦 Motormageddon Version: v$APP_VER (Build $VER_CODE)"
          echo "🏷️ Canal: $CHANNEL"
          echo "🎯 Titre: $RELEASE_TITLE"
          echo "==============================================="

      - name: 📥 Install dependencies
        run: |
          npm install
          chmod -R +x node_modules/.bin || true

      - name: 🏗️ Build WebGL 3D Bundle
        run: npx --yes vite build

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android

      - name: 🔨 Grant execute permissions for gradlew
        run: chmod +x android/gradlew

      - name: 📦 Build Debug APK (Signed with permanent keystore)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          # Créer une copie app-debug.apk pour la compatibilité
          cp app/build/outputs/apk/debug/Motormageddon*.apk app/build/outputs/apk/debug/app-debug.apk 2>/dev/null || true

      - name: 📦 Build Release APK (Signed with permanent keystore)
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace || echo "Release build step completed"

      - name: 📤 Upload Versioned Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Motormageddon-v${{ env.APP_VERSION }}-b${{ env.VERSION_CODE }}-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: 🏷️ Create GitHub Beta Release (On Tag Push or Workflow Dispatch)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/*.apk
          name: "Motormageddon v${{ env.APP_VERSION }} [BETA]"
          body: |
            # 🏁 Motormageddon v${{ env.APP_VERSION }} (Canal BETA)
            
            **Version :** `v${{ env.APP_VERSION }}` (Build `${{ env.VERSION_CODE }}`)  
            **Canal :** `BETA - Version de Test Publique`  
            **Édition :** `${{ env.RELEASE_TITLE }}`  
            
            ---
            
            ### ✨ Nouveautés de cette version Beta :
            - 🔄 **Vrais Ronds-points français** : Anneau 24m, îlot paysager, obélisque, panneaux B21f et véhicules circulant en continu.
            - 🏍️ **Pilotage adouci** : Direction progressive avec filtrage d'inertie (suppression des à-coups brutaux).
            - 💥 **Effets d'impact optimisés** : Étincelles compactes orange mandarine au lieu des gros éléments jaunes.
            - 🚦 **Carrefours urbains & Trafic transversal** : Feux synchronisés, collision avec taxis/camionnettes et relèvement burlesque en 3 phases.
            - 🗺️ **Carte du Tour de France** : Tracé néon doré animé, carrousel d'étapes et emblèmes de villes.
            - 🛵 **Garage nouvelle ergonomie** : Carrousel ◀ / ▶, pilules de catégories claires, sans coupure de texte.
            - 🔇 **Gestion audio & mémoire** : Nettoyage WebAudio natif `@capacitor/app` sans son résiduel.
            - 🔑 **Signature permanente** : Keystore fixe garantissant les futures mises à jour directes sans désinstallation.
            
            ---
            ⚠️ *Note : Cette version est officiellement en phase BETA. Vos retours et signalements de bugs sont précieux.*
          draft: false
          prerelease: true
