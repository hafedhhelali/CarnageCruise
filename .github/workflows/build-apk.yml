name: Build Android APK & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: motormageddon-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    name: 🚀 Build Motormageddon Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🏷️ Extract App Version & Beta Channel
        id: version_info
        run: |
          APP_VER=$(node -p "require('./version.json').version")
          VER_CODE=$(node -p "require('./version.json').versionCode")
          CHANNEL=$(node -p "require('./version.json').channel || 'beta'")
          RELEASE_TITLE=$(node -p "require('./version.json').releaseName || 'Motormageddon Arcade'")
          echo "APP_VERSION=$APP_VER" >> $GITHUB_ENV
          echo "VERSION_CODE=$VER_CODE" >> $GITHUB_ENV
          echo "CHANNEL=$CHANNEL" >> $GITHUB_ENV
          echo "RELEASE_TITLE=$RELEASE_TITLE" >> $GITHUB_ENV
          echo "app_version=$APP_VER" >> $GITHUB_OUTPUT
          echo "version_code=$VER_CODE" >> $GITHUB_OUTPUT
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT
          echo "==============================================="
          echo "📦 Motormageddon Version: v$APP_VER (Build $VER_CODE)"
          echo "🏷️ Canal: $CHANNEL"
          echo "🎯 Titre: $RELEASE_TITLE"
          echo "==============================================="

      - name: 📥 Install dependencies
        run: |
          npm install
          chmod -R +x node_modules/.bin || true

      - name: 🏗️ Build WebGL 3D Bundle
        run: npx --yes vite build

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android

      - name: 🔨 Grant execute permissions for gradlew
        run: chmod +x android/gradlew

      - name: 📦 Build Debug APK (Signed with permanent keystore)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📦 Build Release APK (Signed with permanent keystore)
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace || echo "Release build step completed"

      - name: 📤 Upload Versioned Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Motormageddon-v${{ env.APP_VERSION }}-b${{ env.VERSION_CODE }}-APK
          path: |
            android/app/build/outputs/apk/debug/Motormageddon-*.apk
          retention-days: 14

      - name: 🏷️ Publish GitHub Beta Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          files: |
            android/app/build/outputs/apk/debug/Motormageddon-*.apk
          name: "Motormageddon v${{ env.APP_VERSION }} [BETA]"
          body: |
            # 🏁 Motormageddon v${{ env.APP_VERSION }} (Canal BETA)
            
            **Version :** `v${{ env.APP_VERSION }}` (Build `${{ env.VERSION_CODE }}`)  
            **Canal :** `BETA - Version de Test Publique`  
            **Édition :** `${{ env.RELEASE_TITLE }}`  
            
            ---
            
            ### ✨ Nouveautés de cette version Beta :
            - 🏎️ **Nouveaux Engins Décoratifs & Déjantés** : Décapotable rouge sport rétro, trottinette avec double hache, coureurs à pied avec AK-47 et tronçonneuse.
            - 🐎 **Cheval & FOUET** : Le FOUET remplace la cravache avec manche cuir tressé, virole d'or et lanière articulée claquante.
            - ⚡ **Nitro 5s rechargeable** : Bouton HUD & raccourcis clavier, propulseurs NOS bleu cyan à l'arrière, boost x1.65.
            - 🗺️ **Carte Méditerranéenne & Zoom Interactif** : Boutons de zoom (+/-), molette, Barcelone en Espagne, Rome, Naples & Vésuve, Tunis, Alger, Annaba.
            - 🚦 **Croisements Clairs & Portiques Métalliques** : Portiques lumineux monumentaux avec feux suspendus, zébras d'approche 35m et alertes HUD.
            - 🛡️ **Invulnérabilité Post-Crash Respectée** : Aucun obstacle percutable pendant le clignotement.
            
            ---
            ⚠️ *Note : Cette version est officiellement en phase BETA. Vos retours et signalements de bugs sont précieux.*
          draft: false
          prerelease: true
