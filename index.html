<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0c0d14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Motormageddon Arcade 3D</title>
  <!-- Google Consent Mode v2 & Google Ads (RGPD & ePrivacy) -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { window.dataLayer.push(arguments); }
    window.gtag = gtag;

    // Définir par défaut le consentement publicitaire et analytique sur denied avant le choix utilisateur
    gtag('consent', 'default', {
      'ad_storage': 'denied',
      'ad_user_data': 'denied',
      'ad_personalization': 'denied',
      'analytics_storage': 'denied',
      'wait_for_update': 500
    });
  </script>
  <!-- Balise Google AdSense / Google Ads DÉSACTIVÉE (aucune publicité affichée).
       Pour reactiver la monetisation : decommenter ce script et mettre
       ADS_ENABLED = true dans src/services/AdManager.js -->
  <!-- <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-0000000000000000" crossorigin="anonymous"></script> -->

  <link rel="icon" type="image/svg+xml" href="./logo.svg">
  <link rel="apple-touch-icon" href="./logo.svg">
  <style>
    /* Empêcher tout défilement et zoom tactile involontaire sur smartphone */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0c0d14;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <!-- Conteneur WebGL Three.js -->
  <div id="canvas-container">
    <canvas id="webgl-canvas"></canvas>
  </div>

  <!-- Conteneur d'interface utilisateur réactive -->
  <div id="ui-root"></div>

  <!-- Point d'entrée de l'application -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
