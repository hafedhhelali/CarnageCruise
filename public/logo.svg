<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0c0d14"/>
    </radialGradient>
    <radialGradient id="burst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffa65" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#ff4757" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff4757" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moto" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b81"/>
      <stop offset="100%" stop-color="#d63031"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f6fa"/>
      <stop offset="100%" stop-color="#747d8c"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fond sombre arcade -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Halo de l'explosion (derrière la moto) -->
  <circle cx="256" cy="230" r="150" fill="url(#burst)"/>

  <!-- Onde de choc circulaire -->
  <circle cx="256" cy="230" r="170" fill="none" stroke="#fffa65" stroke-width="6" opacity="0.85" filter="url(#glow)"/>
  <circle cx="256" cy="230" r="200" fill="none" stroke="#ff4757" stroke-width="3" opacity="0.5"/>

  <!-- Étincelles radiales (8 directions) -->
  <g fill="#fffa65" filter="url(#glow)">
    <polygon points="256,60 262,80 250,80"/>
    <polygon points="380,100 365,115 375,125"/>
    <polygon points="426,230 406,224 406,236"/>
    <polygon points="380,360 365,345 375,335"/>
    <polygon points="256,400 250,380 262,380"/>
    <polygon points="132,360 147,345 137,335"/>
    <polygon points="86,230 106,224 106,236"/>
    <polygon points="132,100 147,115 137,125"/>
  </g>

  <!-- Silhouette de moto de guerre (stylisée, inclinée) -->
  <g transform="translate(256,230) rotate(-8) scale(1.05)" filter="url(#shadow)">
    <!-- Roue arrière -->
    <ellipse cx="-95" cy="40" rx="34" ry="34" fill="#1a1a2e" stroke="#f5f6fa" stroke-width="4"/>
    <ellipse cx="-95" cy="40" rx="18" ry="18" fill="url(#chrome)"/>
    <!-- Roue avant -->
    <ellipse cx="95" cy="40" rx="30" ry="30" fill="#1a1a2e" stroke="#f5f6fa" stroke-width="4"/>
    <ellipse cx="95" cy="40" rx="16" ry="16" fill="url(#chrome)"/>
    <!-- Cadre / châssis -->
    <path d="M -70 30 L -30 -25 L 40 -30 L 80 10 L 70 30 Z" fill="url(#moto)" stroke="#fffa65" stroke-width="3"/>
    <!-- Réservoir -->
    <ellipse cx="0" cy="-20" rx="40" ry="18" fill="url(#moto)" stroke="#fffa65" stroke-width="2"/>
    <!-- Fourche avant -->
    <line x1="70" y1="10" x2="95" y2="40" stroke="#f5f6fa" stroke-width="5"/>
    <!-- Bras oscillant arrière -->
    <line x1="-70" y1="30" x2="-95" y2="40" stroke="#f5f6fa" stroke-width="5"/>
    <!-- Tête de fourche / phare -->
    <circle cx="78" cy="-5" r="9" fill="#fffa65" filter="url(#glow)"/>
    <!-- Pot d'échappement -->
    <rect x="-50" y="28" width="30" height="6" rx="3" fill="#747d8c"/>
    <!-- Rider (silhouette simplifiée) -->
    <circle cx="-10" cy="-45" r="14" fill="#2d3436"/>
    <path d="M -10 -31 L -10 5" stroke="#2d3436" stroke-width="8"/>
    <path d="M -10 -20 L -40 0" stroke="#2d3436" stroke-width="6"/>
    <path d="M -10 -20 L 25 0" stroke="#2d3436" stroke-width="6"/>
    <path d="M -10 5 L -30 35" stroke="#2d3436" stroke-width="6"/>
    <path d="M -10 5 L 20 35" stroke="#2d3436" stroke-width="6"/>
  </g>

  <!-- Titre MOTORMAGEDDON -->
  <g filter="url(#shadow)">
    <text x="256" y="440" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="46" font-weight="900" fill="#fffa65" letter-spacing="2" stroke="#d63031" stroke-width="1.5" paint-order="stroke fill">MOTORMAGEDDON</text>
  </g>
  <text x="256" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#00cec9" letter-spacing="4">⚡ CARNAGE URBAIN ⚡</text>
</svg>
