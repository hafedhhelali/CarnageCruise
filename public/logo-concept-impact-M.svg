<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="78%">
      <stop offset="0" stop-color="#20223a"/>
      <stop offset="0.55" stop-color="#141626"/>
      <stop offset="1" stop-color="#0c0d14"/>
    </radialGradient>
    <radialGradient id="burst" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffde9"/>
      <stop offset="0.35" stop-color="#fffa65"/>
      <stop offset="0.6" stop-color="#ffb142"/>
      <stop offset="0.8" stop-color="#ff4757" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff4757" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mY" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffca8"/>
      <stop offset="0.5" stop-color="#fffa65"/>
      <stop offset="1" stop-color="#ffb142"/>
    </linearGradient>
    <linearGradient id="mR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b81"/>
      <stop offset="1" stop-color="#b71540"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55f6ea"/>
      <stop offset="1" stop-color="#00cec9"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <!-- Lettrage M : bloc plein + deux comptes en quad (evenodd), style arcade heavy -->
    <path id="mShape" fill-rule="evenodd"
      d="M110 190 H402 V390 H110 Z
         M200 195 L255 345 L255 390 L200 390 Z
         M310 195 L255 345 L255 390 L310 390 Z"/>
    <clipPath id="frame"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Fond + vignette -->
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- Rayons d'impact (12 secteurs alternés) -->
    <g opacity="0.9">
      <path d="M256 248 L232 -70 L280 -70 Z" fill="#fffa65" opacity="0.22"/>
      <path d="M256 248 L232 -70 L280 -70 Z" fill="#ff4757" opacity="0.28" transform="rotate(30 256 248)"/>
      <path d="M256 248 L232 -70 L280 -70 Z" fill="#fffa65" opacity="0.22" transform="rotate(60 256 248)"/>
      <path d="M256 248 L232 -70 L280 -70 Z" fill="#ff4757" opacity="0.28" transform="rotate(90 256 248)"/>
      <path d="M256 248 L232 -70 L280 -70 Z" fill="#fffa65" opacity="0.22" transform="rotate(120 256 248)"/>
      <path d="M256 248 L232 -70 L280 -70 Z" fill="#ff4757" opacity="0.28" transform="rotate(150 256 248)"/>
      <path d="M256 248 L232 -70 L280 -70 Z" fill="#fffa65" opacity="0.22" transform="rotate(180 256 248)"/>
      <path d="M256 248 L232 -70 L280 -70 Z" fill="#ff4757" opacity="0.28" transform="rotate(210 256 248)"/>
      <path d="M256 248 L232 -70 L280 -70 Z" fill="#fffa65" opacity="0.22" transform="rotate(240 256 248)"/>
      <path d="M256 248 L232 -70 L280 -70 Z" fill="#ff4757" opacity="0.28" transform="rotate(270 256 248)"/>
      <path d="M256 248 L232 -70 L280 -70 Z" fill="#fffa65" opacity="0.22" transform="rotate(300 256 248)"/>
      <path d="M256 248 L232 -70 L280 -70 Z" fill="#ff4757" opacity="0.28" transform="rotate(330 256 248)"/>
    </g>

    <!-- Boum central -->
    <circle cx="256" cy="252" r="215" fill="url(#burst)"/>
    <!-- Chaleur rouge sous le M -->
    <ellipse cx="256" cy="308" rx="175" ry="112" fill="#ff4757" opacity="0.4" filter="url(#blur)"/>

    <!-- Roue arrachée, coin bas-gauche, inclinée -->
    <g transform="translate(92 424) rotate(-24)">
      <circle r="70" fill="#16172a" stroke="#2b2d44" stroke-width="6"/>
      <circle r="44" fill="#0c0d14" stroke="url(#cyan)" stroke-width="9"/>
      <g stroke="#fffa65" stroke-width="8" stroke-linecap="round">
        <line x1="-30" y1="0" x2="30" y2="0"/>
        <line x1="-30" y1="0" x2="30" y2="0" transform="rotate(60)"/>
        <line x1="-30" y1="0" x2="30" y2="0" transform="rotate(120)"/>
      </g>
      <circle r="11" fill="#fffa65" stroke="#ff4757" stroke-width="5"/>
      <path d="M-96 -52 A110 110 0 0 1 -40 -102" fill="none" stroke="#00cec9" stroke-width="8" stroke-linecap="round"/>
      <path d="M-104 -44 A112 112 0 0 1 -64 -92" fill="none" stroke="#00cec9" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- Lettrage M : ombre rouge décalée + face jaune, contour sombre -->
    <g transform="translate(48 -10) skewX(-8)">
      <path d="M110 190 H402 V390 H110 Z
               M200 195 L255 345 L255 390 L200 390 Z
               M310 195 L255 345 L255 390 L310 390 Z"
            fill-rule="evenodd" fill="url(#mR)" transform="translate(14 16)"/>
      <path d="M110 190 H402 V390 H110 Z
               M200 195 L255 345 L255 390 L200 390 Z
               M310 195 L255 345 L255 390 L310 390 Z"
            fill-rule="evenodd" fill="url(#mY)" stroke="#0c0d14" stroke-width="14" paint-order="stroke"/>
    </g>

    <!-- Speed-lines cyan (haut-gauche) -->
    <g fill="url(#cyan)" transform="translate(120 0) skewX(-16)">
      <rect x="96" y="58" width="112" height="12" rx="6"/>
      <rect x="118" y="80" width="78" height="12" rx="6" opacity="0.8"/>
      <rect x="88" y="102" width="58" height="12" rx="6" opacity="0.6"/>
    </g>

    <!-- Éclats -->
    <g fill="url(#cyan)">
      <path d="M96 126 L107 144 L96 162 L85 144 Z"/>
      <path d="M432 158 L441 172 L432 186 L423 172 Z"/>
      <path d="M64 296 L71 307 L64 318 L57 307 Z"/>
      <path d="M448 326 L454 336 L448 346 L442 336 Z"/>
    </g>
    <g fill="none" stroke-linecap="round">
      <path d="M392 84 V124 M372 104 H412" stroke="#ffffff" stroke-width="7"/>
      <path d="M120 46 V70 M108 58 H132" stroke="#00cec9" stroke-width="5"/>
    </g>
  </g>
</svg>
